<!DOCTYPE html>
<html lang="en">
<head>

    <title>Aula 10: Programação orientada a objetos em JS.</title>

<body>

            <th>Cachorro</th>

            </td>
        </tr>
        <tr>
            <td>Mel</td>
            <td>

            <button onclick="mel.saudar();">Saudar</button>

        </tr>
        <tr>
            <td>Leleco</td>
            <td>
            <button onclick="leleco.falar();">Falar</button>
            <button onclick="leleco.comer(0.05);">comer</button>
            <button onclick="leleco.cagar(0.01);">Cagar</button>
            <button onclick="leleco.saudar();">Saudar</button>
            </td>
        </tr>
